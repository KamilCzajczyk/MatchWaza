version: '3.9'

services:
  matchwaza:
    build: .
    container_name: matchwaza-app
    ports:
      - "8888:8888"
    volumes:
      - ./data:/app/data:ro
      - ./assets:/app/assets:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8888"]
      interval: 30s
      timeout: 10s
      retries: 3
